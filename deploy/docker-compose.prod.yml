# Production stack for a single small VPS (2 GB RAM is enough).
#
#   deploy/deploy.sh <image-tag>      (what CI runs on every deploy)
#
# Same shape as the dev stack (docker-compose.yml): Caddy in front, core-api and
# web behind it, Postgres beneath. Differences: images are pulled from GHCR
# (built by CI, tagged with the commit), nothing is bind-mounted, only Caddy
# publishes ports, and object storage is the real bucket (Cloudflare R2), not
# LocalStack. Walk-through: docs/runbook.md.

name: mykomora

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Tuned for a ~2 GB host holding well under 1 GB of data. Not published to
    # the host: only containers on this network can reach it.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - max_wal_size=512MB
    volumes:
      # Postgres 18+ wants the mount at /var/lib/postgresql (see dev compose).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 384m

  # One-shot: brings the schema up to date, then exits. core-api waits for it.
  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/olehmushka/mykomora}-migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  core-api:
    image: ${IMAGE_PREFIX:-ghcr.io/olehmushka/mykomora}-core-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PUBLIC_BASE_URL: https://${DOMAIN}
      APP_SECRET: ${APP_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      INVITE_TTL: ${INVITE_TTL:-168h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: https://${DOMAIN}/api/v1/auth/google/callback
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      # R2 has one URL for both roles: core-api's own calls and the presigned
      # URLs the browser follows. Path-style addressing is already forced in
      # internal/storage/client.go, which R2 supports.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/olehmushka/mykomora}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      CORE_API_URL: http://core-api:8081
    depends_on:
      - core-api
    mem_limit: 384m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing it only costs a re-issue, but keep it
      # across restarts to stay clear of Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - core-api
    mem_limit: 96m

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
