# golangci-lint v2 configuration.
#
# The set is deliberately strict: this codebase will hold a family's entire
# inventory behind a tenancy invariant, so `gosec` and complexity limits earn
# their keep. Generated code is excluded rather than appeased.
version: "2"

linters:
  enable:
    - errcheck      # an ignored error is a silent data bug
    - govet
    - staticcheck
    - unused
    - revive        # style and documentation
    - gosec         # security
    - gocyclo       # complexity limits
    - gocritic
    - dupl          # copy-paste detection

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    gocyclo:
      min-complexity: 12

    dupl:
      threshold: 120

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        # Conflicts with the `if err := ...; err != nil` idiom used throughout.
        - ifElseChain
      settings:
        # The default is 80 bytes, which this codebase trips constantly and
        # never meaningfully: config.Config is a read-only snapshot passed once
        # per construction, and a database row is a value on a path that has
        # just done I/O. Raised rather than disabled, so a genuinely large copy
        # in a genuinely hot loop still gets caught.
        hugeParam:
          sizeThreshold: 512
        rangeValCopy:
          sizeThreshold: 512

    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: context-as-argument
        - name: context-keys-type
        - name: indent-error-flow
        - name: var-declaration
        - name: receiver-naming
        - name: unexported-return
        - name: package-comments
        - name: blank-imports
        - name: range
        - name: superfluous-else
        - name: unreachable-code
        - name: time-naming

  exclusions:
    generated: strict
    rules:
      # Tests may repeat themselves; a table test that reads clearly is worth
      # more than a deduplicated one, and assertions are not security surface.
      - path: _test\.go$
        linters:
          - dupl
          - gosec
          - gocyclo

      # G124 wants Secure, HttpOnly and SameSite provably set. This file is the
      # one place that builds cookies, and two of its decisions are deliberate
      # and cannot satisfy the rule: Secure comes from configuration, because a
      # developer's stack is plain HTTP, and the CSRF cookie is readable by
      # script on purpose — that is what makes double-submit work. Both are
      # argued in comments at the point of decision.
      - path: internal/auth/cookies\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # stdlib | third-party | this module — the three-group order in CLAUDE.md.
      local-prefixes:
        - github.com/olehmushka/mykomora/core-api

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
