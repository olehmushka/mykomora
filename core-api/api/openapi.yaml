  /api/v1/imports/commit:
    post:
      operationId: commitImport
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [imports]
      summary: Create the items in an uploaded CSV
      description: |
        All rows or none. If any row has a problem nothing is created and the
        response is a 400 — run the dry run to see which. The uploaded file
        is deleted on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
