        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: photoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateItemPhoto
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: Reorder a photo or make it the primary one
      description: Setting isPrimary true unsets whichever photo was primary before.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemPhotoRequest"
      responses:
        "200":
          description: The updated photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPhoto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteItemPhoto
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: Delete a photo
      description: If the deleted photo was primary and others remain, the lowest-sortOrder survivor becomes primary.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{itemId}/attachments:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listItemAttachments
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: An item's receipts, manuals and other documents
      responses:
        "200":
          description: Attachments, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemAttachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: confirmItemAttachment
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: Confirm an attachment after it has been uploaded to object storage
      description: Mirrors confirmItemPhoto's HEAD-check, for the single object a non-photo attachment is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmItemAttachmentRequest"
      responses:
        "201":
          description: The confirmed attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemAttachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{itemId}/attachments/{attachmentId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteItemAttachment
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: Delete an attachment
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tags:
    get:
      operationId: listTags
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [tags]
      summary: The family's tags
      responses:
        "200":
          description: Tags, alphabetically.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTag
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [tags]
      summary: Add a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: The created tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tags/{tagId}:
    parameters:
      - name: tagId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTag
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [tags]
      summary: Rename or recolor a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagRequest"
      responses:
        "200":
          description: The updated tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTag
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [tags]
      summary: Delete a tag
      description: A hard delete — tags carry no history to preserve (SPEC 4, "Items").
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mk_session
      description: |
        The access JWT, set by the sign-in flow. `HttpOnly`, `SameSite=Lax`, and
        `Secure` outside development. Cookie-authenticated mutations must also
        echo the `mk_csrf` cookie in an `X-CSRF-Token` header.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The same access JWT as an `Authorization` header. This is the path a
        mobile client takes; it is not subject to the CSRF check, because it is
        not cookie-driven.

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but not allowed to do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such thing in this family.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok`; a non-200 status is the real signal.

    PingResult:
      type: object
      required: [now, database]
      properties:
        now:
          type: string
          format: date-time
          description: Current time as reported by Postgres, not by the API process.
        database:
          type: string
          enum: [ok]
          description: Always `ok`; the 503 response covers the failure case.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          examples: [database_unavailable]
        message:
          type: string
          description: Human-readable detail. Localised from the Go message catalogue (M2 onward).

    FamilyRole:
      type: string
      enum: [owner, member]
      description: |
        Both roles see and edit everything (SPEC 3, "Concepts"). `owner`
        additionally administers the family: settings, members and invites.

    User:
      type: object
      required: [id, email, displayName, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
        locale:
          type: string
          enum: [en, uk]
          description: The stored preference, absent until the user chooses one (M2).
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    Family:
      type: object
      required: [id, name, defaultCurrency, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        defaultCurrency:
          type: string
          description: ISO 4217 code. One currency per family in v1.
          examples: [UAH]
        createdAt:
          type: string
          format: date-time

    Me:
      type: object
      required: [user, family, role]
      properties:
        user:
          $ref: "#/components/schemas/User"
        family:
          $ref: "#/components/schemas/Family"
        role:
          $ref: "#/components/schemas/FamilyRole"

    FamilyMember:
      type: object
      required: [userId, role, joinedAt, email, displayName]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/FamilyRole"
        joinedAt:
          type: string
          format: date-time
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
        lastSeenAt:
          type: string
          format: date-time

    UpdateFamilyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        defaultCurrency:
          type: string
          minLength: 3
          maxLength: 3

    InviteStatus:
      type: string
      enum: [pending, accepted, revoked, expired]

    FamilyInvite:
      type: object
      required: [id, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/InviteStatus"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time

    CreatedInvite:
      type: object
      required: [invite, url]
      properties:
        invite:
          $ref: "#/components/schemas/FamilyInvite"
        url:
          type: string
          description: |
            The full link to share. Returned exactly once — only its hash is
            stored, so it cannot be retrieved later.

    InvitePreview:
      type: object
      required: [usable, familyName]
      properties:
        usable:
          type: boolean
        familyName:
          type: string
        status:
          $ref: "#/components/schemas/InviteStatus"

    Person:
      type: object
      required: [id, name, isChild, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        birthdate:
          type: string
          format: date
        isChild:
          type: boolean
        avatarUrl:
          type: string
        userId:
          type: string
          format: uuid
          description: Set when this person is also a member of the family.
        archivedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePersonRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        birthdate:
          type: string
          format: date
        isChild:
          type: boolean
          default: false
        avatarUrl:
          type: string
        userId:
          type: string
          format: uuid

    UpdatePersonRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        birthdate:
          type: string
          format: date
        isChild:
          type: boolean
        avatarUrl:
          type: string
        userId:
          type: string
          format: uuid

    UpdateMeRequest:
      type: object
      properties:
        locale:
          type: string
          enum: [en, uk]

    LocationKind:
      type: string
      enum: [home, storage, garage, relative, other]

    Location:
      type: object
      required: [id, name, kind, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LocationKind"
        address:
          type: string
        sortOrder:
          type: integer
          format: int32
        archivedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateLocationRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: "#/components/schemas/LocationKind"
        address:
          type: string
        sortOrder:
          type: integer
          format: int32
          default: 0

    UpdateLocationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: "#/components/schemas/LocationKind"
        address:
          type: string
        sortOrder:
          type: integer
          format: int32

    Room:
      type: object
      required: [id, locationId, name, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
        archivedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sortOrder:
          type: integer
          format: int32
          default: 0

    UpdateRoomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sortOrder:
          type: integer
          format: int32

    TraitDataType:
      type: string
      enum: [text, number, integer, bool, date, enum, size]

    TraitDef:
      type: object
      required: [id, categoryId, key, dataType, label, required, filterable, sortOrder, isBuiltin]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        key:
          type: string
        dataType:
          $ref: "#/components/schemas/TraitDataType"
        unit:
          type: string
        enumOptions:
          type: array
          items:
            type: string
        label:
          type: string
          description: Resolved in the request's locale; never a raw catalogue key.
        required:
          type: boolean
        filterable:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        isBuiltin:
          type: boolean
          description: true when this field came from the seed migration rather than a family.
        archivedAt:
          type: string
          format: date-time

    CreateTraitDefRequest:
      type: object
      required: [key, dataType, labelCustom]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: Lowercase letters, digits, underscores or hyphens.
        dataType:
          $ref: "#/components/schemas/TraitDataType"
        unit:
          type: string
        enumOptions:
          type: array
          items:
            type: string
          description: Required, and only meaningful, when dataType is "enum".
        labelCustom:
          type: string
          minLength: 1
          maxLength: 120
        required:
          type: boolean
          default: false
        filterable:
          type: boolean
          default: false
        sortOrder:
          type: integer
          format: int32
          default: 0

    UpdateTraitDefRequest:
      type: object
      properties:
        labelCustom:
          type: string
          minLength: 1
          maxLength: 120
        required:
          type: boolean
        filterable:
          type: boolean
        sortOrder:
          type: integer
          format: int32

    Category:
      type: object
      required: [id, slug, name, sortOrder, isBuiltin, traits, children]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        slug:
          type: string
        icon:
          type: string
        name:
          type: string
          description: Resolved in the request's locale; never a raw catalogue key.
        sortOrder:
          type: integer
          format: int32
        isBuiltin:
          type: boolean
          description: true when this category came from the seed migration rather than a family.
        archivedAt:
          type: string
          format: date-time
        traits:
          type: array
          items:
            $ref: "#/components/schemas/TraitDef"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    Taxonomy:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CreateCategoryRequest:
      type: object
      required: [slug, nameCustom]
      properties:
        parentId:
          type: string
          format: uuid
        slug:
          type: string
          minLength: 1
          maxLength: 64
          description: Lowercase letters, digits, underscores or hyphens.
        icon:
          type: string
        nameCustom:
          type: string
          minLength: 1
          maxLength: 120
        sortOrder:
          type: integer
          format: int32
          default: 0

    UpdateCategoryRequest:
      type: object
      properties:
        nameCustom:
          type: string
          minLength: 1
          maxLength: 120
        icon:
          type: string
        sortOrder:
          type: integer
          format: int32

    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ItemPlacement:
      type: object
      description: Where an item is found, resolved from its root container.
      required: [location, containerPath]
      properties:
        location:
          $ref: "#/components/schemas/NamedRef"
        room:
          $ref: "#/components/schemas/NamedRef"
        spot:
          type: string
        containerPath:
          type: array
          description: Containers the item sits in, outermost first. Empty for a root item.
          items:
            $ref: "#/components/schemas/NamedRef"

    ItemHit:
      type: object
      required: [item, placement]
      properties:
        item:
          $ref: "#/components/schemas/Item"
        placement:
          $ref: "#/components/schemas/ItemPlacement"
        thumbUrl:
          type: string
          format: uri
          description: Presigned GET for the primary photo's thumbnail, absent when the item has none.

    ItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemHit"
        nextCursor:
          type: string
          description: Absent on the last page.

    SimilarItem:
      type: object
      required: [id, name, categoryId, status, score]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ItemStatus"
        score:
          type: number
          format: float

    Dashboard:
      type: object
      required: [totalItems, byLocation, byCategory, value, recentEvents]
      properties:
        totalItems:
          type: integer
          format: int64
        byLocation:
          type: array
          items:
            $ref: "#/components/schemas/DashboardLocationCount"
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCategoryCount"
        value:
          type: array
          description: Purchase value of items still owned, one entry per currency; items without a price are not counted.
          items:
            $ref: "#/components/schemas/DashboardValue"
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/DashboardEvent"

    DashboardLocationCount:
      type: object
      required: [locationId, name, count]
      properties:
        locationId:
          type: string
          format: uuid
        name:
          type: string
        count:
          type: integer
          format: int64

    DashboardCategoryCount:
      type: object
      required: [categoryId, count]
      properties:
        categoryId:
          type: string
          format: uuid
        count:
          type: integer
          format: int64

    DashboardValue:
      type: object
      required: [currency, total, itemCount]
      properties:
        currency:
          type: string
          description: Empty when the purchase had no currency recorded.
        total:
          type: number
          format: double
        itemCount:
          type: integer
          format: int64

    DashboardEvent:
      type: object
      required: [id, itemId, itemName, type, actorUserId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        itemName:
          type: string
        type:
          type: string
        actorUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ItemStatus:
      type: string
      description: |
        Wire values match the stored enum verbatim, including the
        underscores, rather than camelCasing them: a mismatch there would
        mean a response could carry a status string the schema does not
        admit.
      enum: [in_use, stored, lent, to_give_away, consumed, given_away, sold, discarded, lost]

    ItemCondition:
      type: string
      enum: [new, like_new, good, worn, poor]

    ItemSeason:
      type: string
      enum: [summer, winter, demi, all_season]

    SizeSystem:
      type: string
      description: Shared with M2's size normalisation table (SPEC 4, "Size normalisation").
      enum: [kids_cm, kids_eu, intl_letter, eu_adult, shoe_eu, shoe_uk, shoe_us, one_size]

    Item:
      type: object
      required:
        [
          id,
          name,
          categoryId,
          locationId,
          isContainer,
          status,
          quantity,
          traits,
          effectiveLocationId,
          createdBy,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          description: This item's own place. Cosmetic once `parentItemId` is set — see `effectiveLocationId`.
        roomId:
          type: string
          format: uuid
        spot:
          type: string
        parentItemId:
          type: string
          format: uuid
        isContainer:
          type: boolean
        status:
          $ref: "#/components/schemas/ItemStatus"
        quantity:
          type: number
        unit:
          type: string
        minQuantity:
          type: number
        expiresAt:
          type: string
          format: date
        openedAt:
          type: string
          format: date
        paoMonths:
          type: integer
          format: int32
        brand:
          type: string
        condition:
          $ref: "#/components/schemas/ItemCondition"
        season:
          $ref: "#/components/schemas/ItemSeason"
        sizeSystem:
          $ref: "#/components/schemas/SizeSystem"
        sizeValue:
          type: string
        forPersonId:
          type: string
          format: uuid
        serialNumber:
          type: string
        warrantyUntil:
          type: string
          format: date
        purchaseDate:
          type: string
          format: date
        purchasePrice:
          type: number
        purchaseCurrency:
          type: string
        notes:
          type: string
        traits:
          type: object
          additionalProperties: true
          description: Long-tail fields and family-defined custom fields only — never a hot-column key.
        effectiveLocationId:
          type: string
          format: uuid
          description: |
            This item's own locationId when it has no parent; otherwise its
            root container's. Always resolvable (SPEC 4, "Containment").
        effectiveRoomId:
          type: string
          format: uuid
        effectiveSpot:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time

    BarcodeProduct:
      type: object
      required: [code, found]
      properties:
        code:
          type: string
        found:
          type: boolean
        name:
          type: string
        brand:
          type: string
          description: The brand, or for a book its authors.
        categoryHint:
          type: string
          description: The catalogue's own category text, to help the user pick one.
        imageUrl:
          type: string
        source:
          type: string
          description: Which catalogue answered.

    ImportPresignRequest:
      type: object
      required: [contentType, contentLength]
      properties:
        contentType:
          type: string
          examples: [text/csv]
        contentLength:
          type: integer
          format: int64
          description: Exact byte size, at most 5 MiB.

    ImportInspectRequest:
      type: object
      required: [storageKey]
      properties:
        storageKey:
          type: string

    ImportInspection:
      type: object
      required: [headers, rowCount, fields, suggestedMapping]
      properties:
        headers:
          type: array
          items:
            type: string
        rowCount:
          type: integer
        fields:
          type: array
          description: The item fields a column can be mapped to.
          items:
            type: string
        suggestedMapping:
          type: object
          description: Item field to the file's header that probably holds it.
          additionalProperties:
            type: string

    ImportDefaults:
      type: object
      description: Used for rows whose own cell is empty or unmapped.
      properties:
        categoryId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid

    ImportRequest:
      type: object
      required: [storageKey, mapping]
      properties:
        storageKey:
          type: string
        mapping:
          type: object
          description: Item field to the file's header that holds it.
          additionalProperties:
            type: string
        defaults:
          $ref: "#/components/schemas/ImportDefaults"

    ImportRowError:
      type: object
      required: [row, message]
      properties:
        row:
          type: integer
          description: 1-based data row, not counting the header.
        message:
          type: string

    ImportPreviewRow:
      type: object
      required: [row, name]
      properties:
        row:
          type: integer
        name:
          type: string

    ImportReport:
      type: object
      required: [totalRows, validRows, errors, preview]
      properties:
        totalRows:
          type: integer
        validRows:
          type: integer
        errors:
          type: array
          description: At most the first 100 problems.
          items:
            $ref: "#/components/schemas/ImportRowError"
        preview:
          type: array
          description: The first few valid rows.
          items:
            $ref: "#/components/schemas/ImportPreviewRow"

    ImportResult:
      type: object
      required: [created]
      properties:
        created:
          type: integer

    CreateItemsBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CreateItemRequest"

    DuplicateItemRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 50
          default: 1

    CreateItemRequest:
      type: object
      required: [name, categoryId, isContainer, quantity]
      description: |
        Exactly one of `locationId` or `parentItemId` must be given — a new
        item is either placed directly or created inside an existing
        container. `status`, if given, must not be a terminal one; an item
        is always created active.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        categoryId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        spot:
          type: string
        parentItemId:
          type: string
          format: uuid
        isContainer:
          type: boolean
          default: false
        status:
          $ref: "#/components/schemas/ItemStatus"
        quantity:
          type: number
          default: 1
        unit:
          type: string
        minQuantity:
          type: number
        expiresAt:
          type: string
          format: date
        openedAt:
          type: string
          format: date
        paoMonths:
          type: integer
          format: int32
        brand:
          type: string
        condition:
          $ref: "#/components/schemas/ItemCondition"
        season:
          $ref: "#/components/schemas/ItemSeason"
        sizeSystem:
          $ref: "#/components/schemas/SizeSystem"
        sizeValue:
          type: string
        forPersonId:
          type: string
          format: uuid
        serialNumber:
          type: string
        warrantyUntil:
          type: string
          format: date
        purchaseDate:
          type: string
          format: date
        purchasePrice:
          type: number
        purchaseCurrency:
          type: string
        notes:
          type: string
        traits:
          type: object
          additionalProperties: true
        tagIds:
          type: array
          items:
            type: string
            format: uuid

    UpdateItemRequest:
      type: object
      description: |
        Omitted fields are left alone. Place and status are not here on
        purpose — see `/items/{itemId}/move` and `/items/{itemId}/status`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        categoryId:
          type: string
          format: uuid
        quantity:
          type: number
        unit:
          type: string
        minQuantity:
          type: number
        expiresAt:
          type: string
          format: date
        openedAt:
          type: string
          format: date
        paoMonths:
          type: integer
          format: int32
        brand:
          type: string
        condition:
          $ref: "#/components/schemas/ItemCondition"
        season:
          $ref: "#/components/schemas/ItemSeason"
        sizeSystem:
          $ref: "#/components/schemas/SizeSystem"
        sizeValue:
          type: string
        forPersonId:
          type: string
          format: uuid
        serialNumber:
          type: string
        warrantyUntil:
          type: string
          format: date
        purchaseDate:
          type: string
          format: date
        purchasePrice:
          type: number
        purchaseCurrency:
          type: string
        notes:
          type: string
        traits:
          type: object
          additionalProperties: true

    MoveItemRequest:
      type: object
      description: Exactly one of `locationId` or `parentItemId` must be given.
      properties:
        locationId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        spot:
          type: string
        parentItemId:
          type: string
          format: uuid

    SetItemStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ItemStatus"

    ItemEvent:
      type: object
      required: [id, itemId, actorUserId, type, payload, createdAt]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
        type:
          type: string
          description: '`created`, `updated`, `moved`, `status_changed` or `archived` in this milestone; later milestones add more.'
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string

    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: string

    UpdateTagRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: string

    AttachItemTagRequest:
      type: object
      required: [tagId]
      properties:
        tagId:
          type: string
          format: uuid

    UploadPurpose:
      type: string
      description: What a presigned PUT is for — decides the content-type/size allowlist it is checked against.
      enum: [photo, photo_thumb, attachment]

    PresignUploadRequest:
      type: object
      required: [itemId, purpose, contentType, contentLength]
      properties:
        itemId:
          type: string
          format: uuid
        purpose:
          $ref: "#/components/schemas/UploadPurpose"
        contentType:
          type: string
          examples: [image/jpeg]
        contentLength:
          type: integer
          format: int64
          description: Exact byte size of the object about to be uploaded.

    PresignUploadResult:
      type: object
      required: [storageKey, uploadUrl, uploadHeaders, expiresAt]
      properties:
        storageKey:
          type: string
          description: Pass this back unchanged to the confirm endpoint.
        uploadUrl:
          type: string
          format: uri
          description: PUT the object here directly — never through core-api.
        uploadHeaders:
          type: object
          additionalProperties:
            type: string
          description: Headers the PUT request must carry (at minimum Content-Type) for the signature to validate.
        expiresAt:
          type: string
          format: date-time

    ItemPhoto:
      type: object
      required: [id, itemId, url, thumbUrl, width, height, bytes, contentType, isPrimary, sortOrder, uploadedBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: A presigned GET, short-lived — mint a fresh one by listing again rather than caching this.
        thumbUrl:
          type: string
          format: uri
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        bytes:
          type: integer
          format: int64
        contentType:
          type: string
        isPrimary:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        uploadedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ConfirmItemPhotoRequest:
      type: object
      required: [storageKey, thumbStorageKey, width, height, bytes, contentType]
      properties:
        storageKey:
          type: string
        thumbStorageKey:
          type: string
        width:
          type: integer
          format: int32
          minimum: 1
        height:
          type: integer
          format: int32
          minimum: 1
        bytes:
          type: integer
          format: int64
          minimum: 1
        contentType:
          type: string
        isPrimary:
          type: boolean
          default: false

    UpdateItemPhotoRequest:
      type: object
      properties:
        isPrimary:
          type: boolean
        sortOrder:
          type: integer
          format: int32

    AttachmentKind:
      type: string
      enum: [receipt, manual, warranty, other]

    ItemAttachment:
      type: object
      required: [id, itemId, kind, url, filename, contentType, bytes, uploadedBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AttachmentKind"
        url:
          type: string
          format: uri
          description: A presigned GET, short-lived — mint a fresh one by listing again rather than caching this.
        filename:
          type: string
        contentType:
          type: string
        bytes:
          type: integer
          format: int64
        uploadedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ConfirmItemAttachmentRequest:
      type: object
      required: [storageKey, filename, contentType, bytes, kind]
      properties:
        storageKey:
          type: string
        filename:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
        bytes:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: "#/components/schemas/AttachmentKind"
