      responses:
        "200":
          description: The item at its new place.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{itemId}/status:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: setItemStatus
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: Change an item's lifecycle status
      description: |
        `inUse`/`stored`/`lent`/`toGiveAway` move freely among themselves.
        `consumed`/`givenAway`/`sold`/`discarded`/`lost` are terminal: once
        set, the item is archived and no further status change is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetItemStatusRequest"
      responses:
        "200":
          description: The item at its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

