          format: uuid
    post:
      operationId: duplicateItem
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: Copy an item into the same place
      description: |
        Copies fields, traits and tags — not photos, attachments, events or
        contents. A copy of a lent or given-away item starts in use.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateItemRequest"
