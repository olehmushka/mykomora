openapi: 3.1.0
info:
  title: mykomora core-api
  description: |
    Family inventory API. This file is the single source of truth for the HTTP
    contract: Go handlers and types are generated from it with `oapi-codegen`,
    and the web client's types with `openapi-typescript`. Edit the spec first,
    then regenerate. Never hand-edit generated code.

    **core-api owns identity.** The OAuth2 exchange, ID-token verification and
    token issuance all happen here. The web app is a thin client that forwards
    credentials; a future mobile client uses these same endpoints with a bearer
    token instead of cookies.
  version: 0.3.0
  license:
    name: Proprietary
servers:
  - url: http://localhost:8081
    description: Local development (core-api directly)
  - url: http://localhost:8080
    description: Local development (through Caddy)

tags:
  - name: system
    description: Operational endpoints — no tenant data, no authentication.
  - name: auth
    description: Sign-in, session rotation and sign-out.
  - name: family
    description: The tenant itself — its settings, members and invites.
  - name: people
    description: Anyone the family tracks things for. Not the same as a member.
  - name: places
    description: Locations and rooms — where things physically are.
  - name: taxonomy
    description: The category tree and its trait schema, built-in and family-defined.
  - name: items
    description: Real possessions — in real places, optionally inside a container.
  - name: tags
    description: Family-defined labels an item can carry.
  - name: lookup
    description: Barcode and ISBN lookup.
  - name: imports
    description: CSV import.
  - name: uploads
    description: Presigned object-storage uploads (SPEC 6, "Photos and attachments").

# There is deliberately no document-level `security` default. oapi-codegen only
# emits the per-operation security markers that the session middleware reads
# when an operation declares `security` itself, so an inherited default would
# read as protected here and be wide open in Go. Every operation therefore says
# what it requires, and TestEveryOperationDeclaresSecurity fails the build if
# one forgets.

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: Liveness probe
      description: Returns 200 as long as the process is serving. Does not touch the database.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/ping:
    get:
      operationId: getPing
      tags: [system]
      summary: Round-trip probe
      description: |
        Exercises the full request path — generated handler, sqlc query, Postgres —
        and returns the database's own clock. Exists to prove the toolchain end to
        end; it carries no domain meaning.
      security: []
      responses:
        "200":
          description: The database answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResult"
        "503":
          description: The database did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/google/start:
    get:
      operationId: startGoogleAuth
      tags: [auth]
      summary: Begin the Google sign-in flow
      description: |
        Generates the OAuth2 `state` and the PKCE verifier, stores both in a
        signed, short-lived cookie, and redirects to Google. No server-side
        state table is involved.
      security: []
      parameters:
        - name: invite
          in: query
          required: false
          description: |
            An invite token from a `/join/{token}` link. Carried through the
            round trip so the callback can join that family instead of creating
            a new one.
          schema:
            type: string
        - name: next
          in: query
          required: false
          description: |
            Where to land after signing in. Must be a path on this origin;
            anything else is ignored rather than rejected, so a tampered link
            cannot turn sign-in into an open redirect.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to Google's consent screen.
          headers:
            Location:
              required: true
              schema:
                type: string
        "503":
          description: Google sign-in is not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/google/callback:
    get:
      operationId: handleGoogleCallback
      tags: [auth]
      summary: Complete the Google sign-in flow
      description: |
        Validates `state` against the cookie, exchanges the code with PKCE,
        verifies the ID token against Google's JWKS, then upserts the user. A
        first sign-in with no membership creates a family and makes the user its
        owner; a valid invite joins that family instead. Sets the session
        cookies and redirects back into the app.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by Google when the user declines consent.
          schema:
            type: string
      responses:
        "302":
          description: |
            Signed in; redirecting into the app. Anything a person can cause —
            declining consent, following a stale link, an unverified address —
            also redirects, back to the sign-in page with an `error` code.
          headers:
            Location:
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate the session
      description: |
        Exchanges the refresh cookie for a new access/refresh pair. The old
        token is retired in the same statement. Presenting a token that has
        already been rotated is treated as theft: every refresh token belonging
        to that account is revoked, across every family.
      security: []
      responses:
        "204":
          description: Rotated. New cookies are set on this response.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [auth]
      summary: Sign out
      description: Revokes the presented refresh token and clears the session cookies.
      responses:
        "204":
          description: Signed out. The session cookies are cleared on this response.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me:
    get:
      operationId: getMe
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [auth]
      summary: The signed-in user and their current family
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [auth]
      summary: Update the signed-in user's own preferences
      description: Locale is the only preference so far.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/family:
    get:
      operationId: getFamily
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: The current family's settings
      responses:
        "200":
          description: The family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFamily
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Update the current family's settings
      description: Owners only. Omitted fields are left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFamilyRequest"
      responses:
        "200":
          description: The updated family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/family/members:
    get:
      operationId: listFamilyMembers
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Everyone in the current family
      responses:
        "200":
          description: The member list, oldest membership first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyMember"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/family/members/{userId}:
    delete:
      operationId: removeFamilyMember
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Remove a member from the family
      description: |
        Owners only, and owners cannot be removed through this path: there is no
        role-change endpoint yet, so removing the last owner would leave the
        family unadministrable.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/family/invites:
    get:
      operationId: listFamilyInvites
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Invites issued for the current family
      description: Owners only. The tokens themselves are not returned — only their status.
      responses:
        "200":
          description: The invite list, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createFamilyInvite
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Generate a single-use invite link
      description: |
        Owners only. The link is returned exactly once, in this response: only
        its hash is stored, so it cannot be shown again.
      responses:
        "201":
          description: The invite, including the link to share.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/family/invites/{inviteId}:
    delete:
      operationId: revokeFamilyInvite
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Revoke an unused invite
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/invites/{token}:
    get:
      operationId: getInvitePreview
      tags: [family]
      summary: What an invite link leads to
      description: |
        Public, because the invitee has not signed in yet. It returns the
        family's name and whether the link is still usable — never anything
        about the family's contents.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            The invite's state. An unusable link is a 200 with `usable` false,
            not an error: the invitee sees an explanation, not a failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/people:
    get:
      operationId: listPeople
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [people]
      summary: People the family tracks things for
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Children first, then everyone else, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPerson
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [people]
      summary: Add a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonRequest"
      responses:
        "201":
          description: The created person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/people/{personId}:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPerson
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [people]
      summary: One person
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePerson
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [people]
      summary: Update a person
      description: Omitted fields are left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonRequest"
      responses:
        "200":
          description: The updated person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archivePerson
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [people]
      summary: Archive a person
      description: |
        Archives rather than deletes. Items recorded against this person keep
        their history (SPEC 7, "Data safety").
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/locations:
    get:
      operationId: listLocations
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: The family's locations
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Locations, in their sort order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createLocation
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Add a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
      responses:
        "201":
          description: The created location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/locations/{locationId}:
    parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getLocation
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: One location
      responses:
        "200":
          description: The location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateLocation
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Update a location
      description: Omitted fields are left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        "200":
          description: The updated location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archiveLocation
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Archive a location
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/locations/{locationId}/rooms:
    parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listRooms
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: The rooms of one location
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Rooms, in their sort order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRoom
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Add a room to a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: The created room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRoom
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: One room
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRoom
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Update a room
      description: Omitted fields are left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
      responses:
        "200":
          description: The updated room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archiveRoom
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Archive a room
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/taxonomy:
    get:
      operationId: getTaxonomy
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: The localised category tree and its trait schema
      description: |
        Built-in categories ∪ this family's own, nested under their parents,
        each with its resolved traits. Labels are resolved from the request's
        Accept-Language (M2 dropped GeoIP; see docs/MILESTONES.md).
        ETag-cached: send back `If-None-Match` to get a `304` when nothing
        has changed.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The category tree.
          headers:
            ETag:
              schema:
                type: string
            Vary:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxonomy"
        "304":
          description: Nothing has changed since the given ETag.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/categories:
    post:
      operationId: createCategory
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Add a family-defined category
      description: |
        Built-in categories exist only via the seed migration; there is no
        create path for them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: The created category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCategory
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Update a family-defined category
      description: |
        Omitted fields are left alone. A built-in category can never match:
        it has no family_id for the update to be scoped by.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archiveCategory
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Archive a family-defined category
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/categories/{categoryId}/trait-defs:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createTraitDef
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Add a custom field to a category
      description: |
        The category may be built-in or the family's own: a custom field is
        "one code path, one validator, one renderer" per field, not per
        category (SPEC 4, "Taxonomy").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTraitDefRequest"
      responses:
        "201":
          description: The created field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraitDef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trait-defs/{traitDefId}:
    parameters:
      - name: traitDefId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTraitDef
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Update a custom field
      description: |
        Its key and data type are fixed at creation; only the label,
        requiredness, filterability and sort order can change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTraitDefRequest"
      responses:
        "200":
          description: The updated field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraitDef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archiveTraitDef
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Archive a custom field
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/uploads/presign:
    post:
      operationId: presignUpload
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [uploads]
      summary: Request a presigned PUT to upload a photo or attachment
      description: |
        The item must already belong to the caller's family. Content-type
        and size are checked against a per-purpose allowlist before a URL is
        ever minted; the confirm step (`POST /items/{itemId}/photos` or
        `/attachments`) re-checks the real object once uploaded, so a client
        cannot register a mismatched file by lying here (SPEC 6, "Photos
        and attachments" — large files never pass through Go).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignUploadRequest"
      responses:
        "200":
          description: A short-lived upload target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items:
    get:
      operationId: listItems
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: Browse and search the family's items
      description: |
        With no `q` and only place filters, lists root items (a nested item's
        place columns are cosmetic, SPEC 4 "Containment"). With `q` or any
        other filter, nested items are included, and every hit carries the
        container path and room it is found in.

        Pagination is keyset: pass `nextCursor` back unchanged.
      parameters:
        - name: q
          in: query
          required: false
          description: Free text. Matched against name, brand, notes, size, serial number, season/condition words and traits, accent-insensitively and by word prefix.
          schema:
            type: string
            maxLength: 200
        - name: categoryId
          in: query
          required: false
          description: Also matches every descendant category.
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: false
          description: Matches the item's effective place, i.e. its root container's.
          schema:
            type: string
            format: uuid
        - name: roomId
          in: query
          required: false
          description: Matches the item's effective place, i.e. its root container's.
          schema:
            type: string
            format: uuid
        - name: containerId
          in: query
          required: false
          description: Direct contents of this container.
          schema:
            type: string
            format: uuid
        - name: personId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: tagId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ItemStatus"
        - name: season
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ItemSeason"
        - name: condition
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ItemCondition"
        - name: traits
          in: query
          required: false
          description: A JSON object of `trait_defs` keys marked `filterable` and the values they must equal, e.g. `{"shoe_type":"boots"}`.
          schema:
            type: string
            maxLength: 2000
        - name: expiresFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: expiresTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: warrantyFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: warrantyTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: priceMin
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: priceMax
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: sort
          in: query
          required: false
          description: Defaults to `relevance` when `q` is given, otherwise `created` (newest first). `expires` and `price` put items without a value last; `relevance` requires `q`.
          schema:
            type: string
            enum: [relevance, created, name, expires, price]
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page, with the same filters and sort.
          schema:
            type: string
            maxLength: 512
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
            maximum: 200
      responses:
        "200":
          description: One page of hits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createItem
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: Add an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: The created item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/export:
    get:
      operationId: exportItems
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: Download the whole inventory as CSV
      description: |
        Every live (not archived) item, one row each, streamed. Places, the
        container, the person and tags are written as names; the category as
        its slug. The columns are the ones CSV import maps.
      responses:
        "200":
          description: The CSV file.
          headers:
            Content-Disposition:
              description: Makes the browser save it as mykomora-items.csv.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/items/batch:
    post:
      operationId: createItemsBatch
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: Add several items in one transaction
      description: |
        Every row is a complete create request (the client merges the shared
        fields into each row). All rows are created or none are; a rejected
        row is named in the error ("row 3: ...").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemsBatchRequest"
      responses:
        "201":
          description: The created items, in request order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/similar:
    get:
      operationId: findSimilarItems
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [items]
      summary: Existing items whose name is close to a new one
      description: Duplicate hint for the create form. Advisory only; at most five.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
      responses:
        "200":
          description: Close matches, best first; empty when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimilarItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/lookup/barcode/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: An EAN-8, UPC-A, EAN-13 or ISBN-10/13, digits only (ISBN-10 may end in X).
        schema:
          type: string
          minLength: 8
          maxLength: 14
    get:
      operationId: lookupBarcode
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [lookup]
      summary: Look a barcode or ISBN up in public product catalogues
      description: |
        Answers from a shared cache when it can, otherwise asks Open Food
        Facts, Open Beauty Facts, Open Products Facts and (for ISBNs) Google
        Books at once and takes the first hit. Not found is a normal 200 with
        `found: false`, never an error — catalogue coverage outside books,
        food and cosmetics is patchy.
      responses:
        "200":
          description: The product, or a not-found answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/imports/presign:
    post:
      operationId: presignImport
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [imports]
      summary: Presigned upload for a CSV file to import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPresignRequest"
      responses:
        "200":
          description: Where to PUT the file; pass `storageKey` to the other import calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/imports/inspect:
    post:
      operationId: inspectImport
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [imports]
      summary: Read an uploaded CSV's headers and suggest a column mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInspectRequest"
      responses:
        "200":
          description: The file's shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportInspection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/imports/dry-run:
    post:
      operationId: dryRunImport
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [imports]
      summary: Validate an import without writing anything
      description: Reports every row's problems; creates nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
