openapi: 3.1.0
info:
  title: mykomora core-api
  description: |
    Family inventory API. This file is the single source of truth for the HTTP
    contract: Go handlers and types are generated from it with `oapi-codegen`,
    and the web client's types with `openapi-typescript`. Edit the spec first,
    then regenerate. Never hand-edit generated code.

    **core-api owns identity.** The OAuth2 exchange, ID-token verification and
    token issuance all happen here. The web app is a thin client that forwards
    credentials; a future mobile client uses these same endpoints with a bearer
    token instead of cookies.
  version: 0.2.0
  license:
    name: Proprietary
servers:
  - url: http://localhost:8081
    description: Local development (core-api directly)
  - url: http://localhost:8080
    description: Local development (through Caddy)

tags:
  - name: system
    description: Operational endpoints — no tenant data, no authentication.
  - name: auth
    description: Sign-in, session rotation and sign-out.
  - name: family
    description: The tenant itself — its settings, members and invites.
  - name: people
    description: Anyone the family tracks things for. Not the same as a member.
  - name: places
    description: Locations and rooms — where things physically are.
  - name: taxonomy
    description: The category tree and its trait schema, built-in and family-defined.

# There is deliberately no document-level `security` default. oapi-codegen only
# emits the per-operation security markers that the session middleware reads
# when an operation declares `security` itself, so an inherited default would
# read as protected here and be wide open in Go. Every operation therefore says
# what it requires, and TestEveryOperationDeclaresSecurity fails the build if
# one forgets.

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: Liveness probe
      description: Returns 200 as long as the process is serving. Does not touch the database.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/ping:
    get:
      operationId: getPing
      tags: [system]
      summary: Round-trip probe
      description: |
        Exercises the full request path — generated handler, sqlc query, Postgres —
        and returns the database's own clock. Exists to prove the toolchain end to
        end; it carries no domain meaning.
      security: []
      responses:
        "200":
          description: The database answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResult"
        "503":
          description: The database did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/google/start:
    get:
      operationId: startGoogleAuth
      tags: [auth]
      summary: Begin the Google sign-in flow
      description: |
        Generates the OAuth2 `state` and the PKCE verifier, stores both in a
        signed, short-lived cookie, and redirects to Google. No server-side
        state table is involved.
      security: []
      parameters:
        - name: invite
          in: query
          required: false
          description: |
            An invite token from a `/join/{token}` link. Carried through the
            round trip so the callback can join that family instead of creating
            a new one.
          schema:
            type: string
        - name: next
          in: query
          required: false
          description: |
            Where to land after signing in. Must be a path on this origin;
            anything else is ignored rather than rejected, so a tampered link
            cannot turn sign-in into an open redirect.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to Google's consent screen.
          headers:
            Location:
              required: true
              schema:
                type: string
        "503":
          description: Google sign-in is not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/google/callback:
    get:
      operationId: handleGoogleCallback
      tags: [auth]
      summary: Complete the Google sign-in flow
      description: |
        Validates `state` against the cookie, exchanges the code with PKCE,
        verifies the ID token against Google's JWKS, then upserts the user. A
        first sign-in with no membership creates a family and makes the user its
        owner; a valid invite joins that family instead. Sets the session
        cookies and redirects back into the app.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by Google when the user declines consent.
          schema:
            type: string
      responses:
        "302":
          description: |
            Signed in; redirecting into the app. Anything a person can cause —
            declining consent, following a stale link, an unverified address —
            also redirects, back to the sign-in page with an `error` code.
          headers:
            Location:
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate the session
      description: |
        Exchanges the refresh cookie for a new access/refresh pair. The old
        token is retired in the same statement. Presenting a token that has
        already been rotated is treated as theft: every refresh token belonging
        to that account is revoked, across every family.
      security: []
      responses:
        "204":
          description: Rotated. New cookies are set on this response.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [auth]
      summary: Sign out
      description: Revokes the presented refresh token and clears the session cookies.
      responses:
        "204":
          description: Signed out. The session cookies are cleared on this response.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me:
    get:
      operationId: getMe
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [auth]
      summary: The signed-in user and their current family
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [auth]
      summary: Update the signed-in user's own preferences
      description: Locale is the only preference so far.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/family:
    get:
      operationId: getFamily
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: The current family's settings
      responses:
        "200":
          description: The family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFamily
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Update the current family's settings
      description: Owners only. Omitted fields are left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFamilyRequest"
      responses:
        "200":
          description: The updated family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/family/members:
    get:
      operationId: listFamilyMembers
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Everyone in the current family
      responses:
        "200":
          description: The member list, oldest membership first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyMember"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/family/members/{userId}:
    delete:
      operationId: removeFamilyMember
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Remove a member from the family
      description: |
        Owners only, and owners cannot be removed through this path: there is no
        role-change endpoint yet, so removing the last owner would leave the
        family unadministrable.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/family/invites:
    get:
      operationId: listFamilyInvites
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Invites issued for the current family
      description: Owners only. The tokens themselves are not returned — only their status.
      responses:
        "200":
          description: The invite list, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createFamilyInvite
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Generate a single-use invite link
      description: |
        Owners only. The link is returned exactly once, in this response: only
        its hash is stored, so it cannot be shown again.
      responses:
        "201":
          description: The invite, including the link to share.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/family/invites/{inviteId}:
    delete:
      operationId: revokeFamilyInvite
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [family]
      summary: Revoke an unused invite
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/invites/{token}:
    get:
      operationId: getInvitePreview
      tags: [family]
      summary: What an invite link leads to
      description: |
        Public, because the invitee has not signed in yet. It returns the
        family's name and whether the link is still usable — never anything
        about the family's contents.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            The invite's state. An unusable link is a 200 with `usable` false,
            not an error: the invitee sees an explanation, not a failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/people:
    get:
      operationId: listPeople
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [people]
      summary: People the family tracks things for
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Children first, then everyone else, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPerson
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [people]
      summary: Add a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonRequest"
      responses:
        "201":
          description: The created person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/people/{personId}:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPerson
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [people]
      summary: One person
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePerson
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [people]
      summary: Update a person
      description: Omitted fields are left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonRequest"
      responses:
        "200":
          description: The updated person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archivePerson
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [people]
      summary: Archive a person
      description: |
        Archives rather than deletes. Items recorded against this person keep
        their history (SPEC 7, "Data safety").
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/locations:
    get:
      operationId: listLocations
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: The family's locations
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Locations, in their sort order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createLocation
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Add a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
      responses:
        "201":
          description: The created location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/locations/{locationId}:
    parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getLocation
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: One location
      responses:
        "200":
          description: The location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateLocation
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Update a location
      description: Omitted fields are left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        "200":
          description: The updated location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archiveLocation
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Archive a location
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/locations/{locationId}/rooms:
    parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listRooms
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: The rooms of one location
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Rooms, in their sort order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRoom
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Add a room to a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: The created room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRoom
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: One room
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRoom
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Update a room
      description: Omitted fields are left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
      responses:
        "200":
          description: The updated room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archiveRoom
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [places]
      summary: Archive a room
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/taxonomy:
    get:
      operationId: getTaxonomy
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: The localised category tree and its trait schema
      description: |
        Built-in categories ∪ this family's own, nested under their parents,
        each with its resolved traits. Labels are resolved from the request's
        Accept-Language (M2 dropped GeoIP; see docs/MILESTONES.md).
        ETag-cached: send back `If-None-Match` to get a `304` when nothing
        has changed.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The category tree.
          headers:
            ETag:
              schema:
                type: string
            Vary:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxonomy"
        "304":
          description: Nothing has changed since the given ETag.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/categories:
    post:
      operationId: createCategory
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Add a family-defined category
      description: |
        Built-in categories exist only via the seed migration; there is no
        create path for them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: The created category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCategory
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Update a family-defined category
      description: |
        Omitted fields are left alone. A built-in category can never match:
        it has no family_id for the update to be scoped by.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archiveCategory
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Archive a family-defined category
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/categories/{categoryId}/trait-defs:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createTraitDef
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Add a custom field to a category
      description: |
        The category may be built-in or the family's own: a custom field is
        "one code path, one validator, one renderer" per field, not per
        category (SPEC 4, "Taxonomy").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTraitDefRequest"
      responses:
        "201":
          description: The created field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraitDef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trait-defs/{traitDefId}:
    parameters:
      - name: traitDefId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTraitDef
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Update a custom field
      description: |
        Its key and data type are fixed at creation; only the label,
        requiredness, filterability and sort order can change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTraitDefRequest"
      responses:
        "200":
          description: The updated field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraitDef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archiveTraitDef
      security:
        - sessionCookie: []
        - bearerToken: []
      tags: [taxonomy]
      summary: Archive a custom field
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mk_session
      description: |
        The access JWT, set by the sign-in flow. `HttpOnly`, `SameSite=Lax`, and
        `Secure` outside development. Cookie-authenticated mutations must also
        echo the `mk_csrf` cookie in an `X-CSRF-Token` header.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The same access JWT as an `Authorization` header. This is the path a
        mobile client takes; it is not subject to the CSRF check, because it is
        not cookie-driven.

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but not allowed to do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such thing in this family.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok`; a non-200 status is the real signal.

    PingResult:
      type: object
      required: [now, database]
      properties:
        now:
          type: string
          format: date-time
          description: Current time as reported by Postgres, not by the API process.
        database:
          type: string
          enum: [ok]
          description: Always `ok`; the 503 response covers the failure case.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          examples: [database_unavailable]
        message:
          type: string
          description: Human-readable detail. Localised from the Go message catalogue (M2 onward).

    FamilyRole:
      type: string
      enum: [owner, member]
      description: |
        Both roles see and edit everything (SPEC 3, "Concepts"). `owner`
        additionally administers the family: settings, members and invites.

    User:
      type: object
      required: [id, email, displayName, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
        locale:
          type: string
          enum: [en, uk]
          description: The stored preference, absent until the user chooses one (M2).
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    Family:
      type: object
      required: [id, name, defaultCurrency, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        defaultCurrency:
          type: string
          description: ISO 4217 code. One currency per family in v1.
          examples: [UAH]
        createdAt:
          type: string
          format: date-time

    Me:
      type: object
      required: [user, family, role]
      properties:
        user:
          $ref: "#/components/schemas/User"
        family:
          $ref: "#/components/schemas/Family"
        role:
          $ref: "#/components/schemas/FamilyRole"

    FamilyMember:
      type: object
      required: [userId, role, joinedAt, email, displayName]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/FamilyRole"
        joinedAt:
          type: string
          format: date-time
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
        lastSeenAt:
          type: string
          format: date-time

    UpdateFamilyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        defaultCurrency:
          type: string
          minLength: 3
          maxLength: 3

    InviteStatus:
      type: string
      enum: [pending, accepted, revoked, expired]

    FamilyInvite:
      type: object
      required: [id, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/InviteStatus"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time

    CreatedInvite:
      type: object
      required: [invite, url]
      properties:
        invite:
          $ref: "#/components/schemas/FamilyInvite"
        url:
          type: string
          description: |
            The full link to share. Returned exactly once — only its hash is
            stored, so it cannot be retrieved later.

    InvitePreview:
      type: object
      required: [usable, familyName]
      properties:
        usable:
          type: boolean
        familyName:
          type: string
        status:
          $ref: "#/components/schemas/InviteStatus"

    Person:
      type: object
      required: [id, name, isChild, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        birthdate:
          type: string
          format: date
        isChild:
          type: boolean
        avatarUrl:
          type: string
        userId:
          type: string
          format: uuid
          description: Set when this person is also a member of the family.
        archivedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePersonRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        birthdate:
          type: string
          format: date
        isChild:
          type: boolean
          default: false
        avatarUrl:
          type: string
        userId:
          type: string
          format: uuid

    UpdatePersonRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        birthdate:
          type: string
          format: date
        isChild:
          type: boolean
        avatarUrl:
          type: string
        userId:
          type: string
          format: uuid

    UpdateMeRequest:
      type: object
      properties:
        locale:
          type: string
          enum: [en, uk]

    LocationKind:
      type: string
      enum: [home, storage, garage, relative, other]

    Location:
      type: object
      required: [id, name, kind, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LocationKind"
        address:
          type: string
        sortOrder:
          type: integer
          format: int32
        archivedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateLocationRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: "#/components/schemas/LocationKind"
        address:
          type: string
        sortOrder:
          type: integer
          format: int32
          default: 0

    UpdateLocationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: "#/components/schemas/LocationKind"
        address:
          type: string
        sortOrder:
          type: integer
          format: int32

    Room:
      type: object
      required: [id, locationId, name, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
        archivedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sortOrder:
          type: integer
          format: int32
          default: 0

    UpdateRoomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sortOrder:
          type: integer
          format: int32

    TraitDataType:
      type: string
      enum: [text, number, integer, bool, date, enum, size]

    TraitDef:
      type: object
      required: [id, categoryId, key, dataType, label, required, filterable, sortOrder, isBuiltin]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        key:
          type: string
        dataType:
          $ref: "#/components/schemas/TraitDataType"
        unit:
          type: string
        enumOptions:
          type: array
          items:
            type: string
        label:
          type: string
          description: Resolved in the request's locale; never a raw catalogue key.
        required:
          type: boolean
        filterable:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        isBuiltin:
          type: boolean
          description: true when this field came from the seed migration rather than a family.
        archivedAt:
          type: string
          format: date-time

    CreateTraitDefRequest:
      type: object
      required: [key, dataType, labelCustom]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: Lowercase letters, digits, underscores or hyphens.
        dataType:
          $ref: "#/components/schemas/TraitDataType"
        unit:
          type: string
        enumOptions:
          type: array
          items:
            type: string
          description: Required, and only meaningful, when dataType is "enum".
        labelCustom:
          type: string
          minLength: 1
          maxLength: 120
        required:
          type: boolean
          default: false
        filterable:
          type: boolean
          default: false
        sortOrder:
          type: integer
          format: int32
          default: 0

    UpdateTraitDefRequest:
      type: object
      properties:
        labelCustom:
          type: string
          minLength: 1
          maxLength: 120
        required:
          type: boolean
        filterable:
          type: boolean
        sortOrder:
          type: integer
          format: int32

    Category:
      type: object
      required: [id, slug, name, sortOrder, isBuiltin, traits, children]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        slug:
          type: string
        icon:
          type: string
        name:
          type: string
          description: Resolved in the request's locale; never a raw catalogue key.
        sortOrder:
          type: integer
          format: int32
        isBuiltin:
          type: boolean
          description: true when this category came from the seed migration rather than a family.
        archivedAt:
          type: string
          format: date-time
        traits:
          type: array
          items:
            $ref: "#/components/schemas/TraitDef"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    Taxonomy:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CreateCategoryRequest:
      type: object
      required: [slug, nameCustom]
      properties:
        parentId:
          type: string
          format: uuid
        slug:
          type: string
          minLength: 1
          maxLength: 64
          description: Lowercase letters, digits, underscores or hyphens.
        icon:
          type: string
        nameCustom:
          type: string
          minLength: 1
          maxLength: 120
        sortOrder:
          type: integer
          format: int32
          default: 0

    UpdateCategoryRequest:
      type: object
      properties:
        nameCustom:
          type: string
          minLength: 1
          maxLength: 120
        icon:
          type: string
        sortOrder:
          type: integer
          format: int32
