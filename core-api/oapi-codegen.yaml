# oapi-codegen configuration. Regenerate with `make generate`; CI fails on drift.
# The generated file is committed and must never be hand-edited.
package: api
output: internal/api/api.gen.go
generate:
  # The spec is embedded so GetSwagger() can be walked at test time: one test
  # asserts that every operation is either on the handwritten public list or
  # behind the session middleware, which is the auth analogue of sqlc.yaml's
  # family-scoped rule.
  embedded-spec: true
  chi-server: true
  strict-server: true
  models: true
output-options:
  skip-prune: false
