version: "2"
sql:
  - engine: "postgresql"
    # goose migrations double as the schema: one source of truth, no drift
    # between what sqlc type-checks against and what actually ships.
    schema: "db/migrations"
    queries: "db/queries"
    # Only `sqlc vet` connects; `sqlc generate` type-checks offline against the
    # migrations above, so codegen never depends on a running database.
    database:
      uri: "${DATABASE_URL}"
    analyzer:
      # Keep codegen offline: types are inferred from the migrations, not from a
      # live server, so `make generate` works on a laptop with nothing running.
      database: false
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          # pgx has no codec for tsvector; it travels as text. Nothing in Go reads
          # the column (search runs in SQL), the override only keeps `SELECT *`
          # scannable.
          - db_type: "tsvector"
            go_type: "string"
            nullable: true
    rules:
      - sqlc/db-prepare
      - family-scoped

rules:
  # SPEC 4, "Tenancy invariant": every query takes family_id and every handler
  # resolves it from the session. A query without a family scope is a review
  # failure. This makes it a CI failure too.
  #
  # The allowlist is intentionally in this file rather than in a magic comment:
  # widening it is a diff a reviewer cannot miss.
  #
  # Everything on it is justified where the query is written. In short: `users`
  # is the only global table in the schema, so identity resolution genuinely
  # runs before a tenant exists; reuse detection revokes an account's tokens
  # across every family it belongs to, on purpose; and the orphaned-object
  # cleanup sweeper (db/queries/attachments.sql's ListAllStorageKeys) needs
  # every family's storage keys at once, with no per-family loop to run; and
  # `product_cache` holds public barcode metadata shared by every family.
  - name: family-scoped
    message: >-
      query is not family-scoped: it must filter or insert on family_id
      (see SPEC.md "Tenancy invariant"). If it genuinely touches no tenant data,
      add its name to the allowlist in the family-scoped rule in sqlc.yaml.
    rule: >-
      !query.sql.contains("family_id") && !(query.name in [
        "GetServerTime",
        "UpsertUserByGoogleSub",
        "GetUserByID",
        "TouchUserLastSeen",
        "RevokeAllUserRefreshTokens",
        "UpdateUserLocale",
        "ListAllStorageKeys",
        "GetProductCache",
        "UpsertProductCache"
      ])
